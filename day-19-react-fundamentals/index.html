<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 19 - React Fundamentals Demo (JSX, Props, State, Composition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .badge {
      background: #3b82f6;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .header h1 { font-size: 1.8rem; color: #60a5fa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1.5rem; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.5rem;
    }
    .card h2 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
    .user-card {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .counter-box {
      background: #0f172a;
      padding: 1.25rem;
      border-radius: 0.75rem;
      text-align: center;
      margin-top: 1rem;
    }
    .counter-value { font-size: 2.5rem; font-weight: 700; color: #a855f7; }
    .btn-group { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // 1. Functional Component nhận Props (UserCard) - Minh họa Props & Component Composition
    function UserCard({ user, onToggleRole, onDelete }) {
      return (
        <div className="user-card">
          <div>
            <h4 style={{ color: '#e2e8f0' }}>{user.name}</h4>
            <span style={{ fontSize: '0.85rem', color: user.role === 'Admin' ? '#f59e0b' : '#94a3b8' }}>
              Vai trò: <strong>{user.role}</strong>
            </span>
          </div>
          <div style={{ display: 'flex', gap: '0.4rem' }}>
            <button onClick={() => onToggleRole(user.id)} style={{ fontSize: '0.8rem', padding: '0.3rem 0.6rem' }}>
              Đổi vai trò
            </button>
            <button className="danger" onClick={() => onDelete(user.id)} style={{ fontSize: '0.8rem', padding: '0.3rem 0.6rem' }}>
              Xóa
            </button>
          </div>
        </div>
      );
    }

    // 2. Functional Component minh họa State (Counter) - Props vs State
    function CounterSection() {
      const [count, setCount] = useState(0);

      return (
        <div className="card">
          <h2>1. Props vs State (Counter Demo)</h2>
          <p style={{ color: '#94a3b8', fontSize: '0.9rem', marginBottom: '0.75rem' }}>
            <strong>State:</strong> Dữ liệu nội bộ tự thay đổi và kích hoạt re-render UI khi gọi <code>setCount</code>.
          </p>
          <div className="counter-box">
            <div className="counter-value">{count}</div>
            <div className="btn-group">
              <button onClick={() => setCount(prev => prev - 1)}>- Giảm</button>
              <button onClick={() => setCount(0)} style={{ background: '#475569' }}>Reset</button>
              <button onClick={() => setCount(prev => prev + 1)}>+ Tăng</button>
            </div>
          </div>
        </div>
      );
    }

    // 3. Functional Component minh họa List Rendering with Keys & Composition
    function UserListSection() {
      const [users, setUsers] = useState([
        { id: 1, name: 'Nguyễn Sinh Huân', role: 'Admin' },
        { id: 2, name: 'Lê Thị Mai', role: 'Developer' },
        { id: 3, name: 'Trần Văn Tuấn', role: 'Designer' }
      ]);
      const [newName, setNewName] = useState('');

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        const newUser = {
          id: Date.now(),
          name: newName.trim(),
          role: 'Developer'
        };
        setUsers([...users, newUser]);
        setNewName('');
      };

      const handleToggleRole = (id) => {
        setUsers(users.map(u => u.id === id ? { ...u, role: u.role === 'Admin' ? 'Developer' : 'Admin' } : u));
      };

      const handleDelete = (id) => {
        setUsers(users.filter(u => u.id !== id));
      };

      return (
        <div className="card">
          <h2>2. List Rendering with Keys & Composition</h2>
          <p style={{ color: '#94a3b8', fontSize: '0.9rem', marginBottom: '1rem' }}>
            Duyệt danh sách bằng <code>users.map()</code> và truyền unique <code>key={`{user.id}`}</code> cho React Virtual DOM.
          </p>
          <form onSubmit={handleAddUser} className="input-group">
            <input 
              type="text" 
              placeholder="Nhập tên thành viên mới..." 
              value={newName} 
              onChange={(e) => setNewName(e.target.value)} 
            />
            <button type="submit">+ Thêm</button>
          </form>
          <div>
            {users.map(user => (
              <UserCard 
                key={user.id} 
                user={user} 
                onToggleRole={handleToggleRole} 
                onDelete={handleDelete} 
              />
            ))}
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      return (
        <div className="container">
          <div className="header">
            <span className="badge">Day 19 Demo</span>
            <h1>React Fundamentals</h1>
            <p style={{ color: '#94a3b8', marginTop: '0.5rem' }}>JSX Syntax, Functional Components, Props vs State & List Keys</p>
          </div>
          <div className="grid">
            <CounterSection />
            <UserListSection />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
