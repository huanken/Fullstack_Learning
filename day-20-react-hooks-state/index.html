<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 20 - React Hooks & State Management Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 950px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2rem; }
    .badge {
      background: #10b981;
      color: #064e3b;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .header h1 { font-size: 1.8rem; color: #34d399; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 1.5rem; }
    .card {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 1.5rem;
    }
    .card h2 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 0.75rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
    .hook-tag { font-family: monospace; background: #1e293b; color: #f43f5e; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
    .timer-display {
      font-size: 2.2rem;
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
      text-align: center;
      padding: 1rem;
      background: #0a0f1d;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }
    button {
      background: #059669;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #047857; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    .log-box {
      background: #0a0f1d;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 0.8rem;
      max-height: 120px;
      overflow-y: auto;
      color: #94a3b8;
    }
    .shared-box {
      background: #0a0f1d;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 0.75rem;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      background: #131d2e;
      border: 1px solid #334155;
      border-radius: 0.4rem;
      color: white;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom Hook 1: useTimer với cleanup function trong useEffect
    function useTimer() {
      const [seconds, setSeconds] = useState(0);
      const [isRunning, setIsRunning] = useState(false);

      useEffect(() => {
        let intervalId = null;
        if (isRunning) {
          intervalId = setInterval(() => {
            setSeconds(prev => prev + 1);
          }, 1000);
        }
        // Cleanup function (tránh memory leak khi unmount hoặc dependency thay đổi)
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [isRunning]);

      const reset = () => {
        setIsRunning(false);
        setSeconds(0);
      };

      return { seconds, isRunning, setIsRunning, reset };
    }

    // Component 1: Demo useEffect & Cleanup (Timer)
    function TimerDemo() {
      const { seconds, isRunning, setIsRunning, reset } = useTimer();

      return (
        <div className="card">
          <h2>1. <span className="hook-tag">useEffect</span> & Cleanup Function (Custom Hook)</h2>
          <p style={{ color: '#94a3b8', fontSize: '0.85rem' }}>
            Minh họa việc đăng ký <code>setInterval</code> trong effect và dọn dẹp (cleanup) khi dependency <code>isRunning</code> thay đổi.
          </p>
          <div className="timer-display">
            {Math.floor(seconds / 60).toString().padStart(2, '0')}:{(seconds % 60).toString().padStart(2, '0')}
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', gap: '0.75rem' }}>
            <button onClick={() => setIsRunning(!isRunning)}>
              {isRunning ? 'Tạm dừng (Pause)' : 'Bắt đầu (Start)'}
            </button>
            <button className="secondary" onClick={reset}>Reset</button>
          </div>
        </div>
      );
    }

    // Component 2: Lifting State Up (Nâng state lên component cha để 2 component con cùng chia sẻ)
    function ChildInput({ label, value, onChange }) {
      return (
        <div style={{ marginBottom: '0.75rem' }}>
          <label style={{ fontSize: '0.85rem', color: '#38bdf8' }}>{label}:</label>
          <input 
            type="text" 
            value={value} 
            onChange={(e) => onChange(e.target.value)} 
            placeholder="Nhập nội dung vào đây..." 
          />
        </div>
      );
    }

    function LiftingStateDemo() {
      // Shared state nằm ở component cha
      const [sharedText, setSharedText] = useState('Dữ liệu được chia sẻ giữa 2 Component con');

      return (
        <div className="card">
          <h2>2. Lifting State Up (Shared vs Local State)</h2>
          <p style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '1rem' }}>
            Khi 2 component con cần đồng bộ dữ liệu với nhau, chúng ta nhấc state lên component cha gần nhất.
          </p>
          
          <ChildInput label="Component Con A (Input 1)" value={sharedText} onChange={setSharedText} />
          <ChildInput label="Component Con B (Input 2)" value={sharedText} onChange={setSharedText} />

          <div className="shared-box">
            <span style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Xem trước dữ liệu đồng bộ tại Cha:</span>
            <div style={{ color: '#34d399', fontWeight: 600, marginTop: '0.25rem' }}>
              {sharedText || '(Chưa nhập)'}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="container">
          <div className="header">
            <span className="badge">Day 20 Demo</span>
            <h1>React Hooks & State Management</h1>
            <p style={{ color: '#94a3b8', marginTop: '0.5rem' }}>useState, useEffect, Cleanups & Lifting State Up</p>
          </div>
          <div className="grid">
            <TimerDemo />
            <LiftingStateDemo />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
